<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="50%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>

    <!-- Brand Primary Gradient for Sparrow Body -->
    <linearGradient id="birdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="40%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Wing Highlight Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <!-- Ambient Subtle Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#383D4D"/>
      <stop offset="100%" stop-color="#1B1E28"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Ambient Glow Behind Bird -->
  <circle cx="256" cy="256" r="140" fill="#6366F1" opacity="0.12" filter="url(#subtleGlow)"/>

  <!-- Minimalist Geometric Maya (Sparrow) Vector Silhouette -->
  <g transform="translate(42, 28)">
    <!-- Main Body & Head: Fluid aerodynamic profile -->
    <path d="M 280 130
             C 240 120 205 138 185 165
             C 165 192 160 225 168 255
             C 176 288 200 325 240 345
             C 285 368 335 350 365 315
             C 385 292 390 260 380 230
             C 365 185 325 140 280 130 Z"
          fill="url(#birdGrad)"/>

    <!-- Sharp Sparrow Beak -->
    <path d="M 175 160
             L 120 182
             L 170 200
             Z"
          fill="#C7D2FE"/>

    <!-- Distinctive Maya Cheek Patch Cutout (Iconic to Tree Sparrow) -->
    <ellipse cx="205" cy="205" rx="18" ry="14" transform="rotate(-15 205 205)" fill="#0E1015"/>

    <!-- Sparrow Eye -->
    <circle cx="218" cy="172" r="7" fill="#08090C"/>
    <circle cx="220" cy="170" r="2.5" fill="#FFFFFF"/>

    <!-- Stylized Wing Feather Arc -->
    <path d="M 235 220
             C 280 215 340 240 360 290
             C 340 305 300 310 260 285
             C 240 270 228 245 235 220 Z"
          fill="url(#wingGrad)"
          opacity="0.9"/>

    <!-- Minimalist Tail Feathers -->
    <path d="M 345 325
             L 425 400
             L 395 408
             L 330 345
             Z"
          fill="#4338CA"/>
    <path d="M 335 340
             L 395 408
             L 370 412
             L 315 350
             Z"
          fill="#3730A3"/>
  </g>
</svg>
